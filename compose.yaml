services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: room_booking
      POSTGRES_PASSWORD: example_password
      POSTGRES_DB: room_booking
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - room-booking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U room_booking -d room_booking"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  room-booking-pgdata:
